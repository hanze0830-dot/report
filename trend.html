<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户反馈趋势分析 · 报告目录</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2c3e50; min-height: 100vh; padding: 60px 20px; }
.container { max-width: 720px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 48px; }
.header .icon { font-size: 48px; margin-bottom: 16px; }
.header h1 { font-size: 28px; font-weight: 700; color: #2c3e50; letter-spacing: 1px; margin-bottom: 10px; }
.header p { font-size: 14px; color: #7f8c8d; }
.timeline { position: relative; padding-left: 32px; }
.timeline::before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, #667eea, #764ba2, #e74c3c); border-radius: 2px; }
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item::before { content: ''; position: absolute; left: -25px; top: 22px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #667eea; background: #f5f6fa; z-index: 1; }
.timeline-item:nth-child(2)::before { border-color: #764ba2; }
.timeline-item:nth-child(3)::before { border-color: #e74c3c; }
.card { display: block; background: white; border: 1px solid #ecf0f1; border-radius: 14px; padding: 24px 28px; text-decoration: none; color: #2c3e50; transition: all .25s ease; }
.card:hover { border-color: #667eea; transform: translateX(6px); box-shadow: 0 4px 16px rgba(102,126,234,.12); }
.card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.card h3 { font-size: 17px; font-weight: 600; color: #2c3e50; }
.card .badge { padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-latest { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
.badge-normal { background: #ecf0f1; color: #7f8c8d; }
.card .desc { font-size: 13px; color: #95a5a6; }
.card .arrow { float: right; font-size: 18px; color: #bdc3c7; transition: all .25s; }
.card:hover .arrow { color: #667eea; transform: translateX(4px); }
.footer { text-align: center; font-size: 11px; color: #bdc3c7; margin-top: 48px; letter-spacing: .5px; }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <img src="dramabox_logo.png" alt="DramaBox" style="height:48px;margin-bottom:16px;">
  <h1>用户反馈趋势分析</h1>
  <p>DramaBox · 产品差评分类 / 用户投诉工单 / 多语言剧集评分 三大维度追踪</p>
</div>

<div class="timeline">

  <div class="timeline-item">
    <a class="card" href="用户反馈趋势分析报告4-5月.html">
      <div class="top">
        <h3>4 - 5 月趋势报告</h3>
        <span class="badge badge-latest">最新</span>
      </div>
      <div class="desc">2026年4月 ~ 5月用户反馈数据对比与趋势洞察 <span class="arrow">→</span></div>
    </a>
  </div>

  <div class="timeline-item">
    <a class="card" href="用户反馈趋势分析报告3-4月.html">
      <div class="top">
        <h3>3 - 4 月趋势报告</h3>
        <span class="badge badge-normal">2026/04</span>
      </div>
      <div class="desc">2026年3月 ~ 4月用户反馈数据对比与趋势洞察 <span class="arrow">→</span></div>
    </a>
  </div>

  <div class="timeline-item">
    <a class="card" href="用户反馈趋势分析报告2-3月.html">
      <div class="top">
        <h3>2 - 3 月趋势报告</h3>
        <span class="badge badge-normal">2026/03</span>
      </div>
      <div class="desc">2026年2月 ~ 3月用户反馈数据对比与趋势洞察 <span class="arrow">→</span></div>
    </a>
  </div>

</div>

<div class="footer">Produced by Zephyr 韩泽 · DramaBox 用户洞察</div>

</div>
</body>
</html>
