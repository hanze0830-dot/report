<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户反馈趋势分析 · DramaBox</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; }

/* ── nav ── */
.nav { background: #fff; padding: 16px 0; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 10; }
.nav-inner { max-width: 720px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #ff6a5e 0%, #e8346a 50%, #c22eae 100%); display: flex; align-items: center; justify-content: center; }
.logo-icon svg { width: 16px; height: 16px; fill: #fff; margin-left: 2px; }
.logo-text { font-size: 20px; font-weight: 700; color: #1a1a1a; letter-spacing: -.3px; }

/* ── hero ── */
.hero { max-width: 720px; margin: 0 auto; padding: 64px 20px 48px; text-align: center; }
.hero h1 { font-size: 32px; font-weight: 800; color: #1a1a1a; margin-bottom: 14px; letter-spacing: -.5px; }
.hero .subtitle { font-size: 14px; color: #888; line-height: 1.8; }
.hero .subtitle span { display: inline-block; padding: 2px 10px; margin: 3px 4px; background: #f5f5f5; border-radius: 6px; font-size: 13px; color: #555; }
.divider { width: 40px; height: 3px; background: linear-gradient(90deg, #ff6a5e, #e8346a); border-radius: 3px; margin: 28px auto 0; }

/* ── cards ── */
.cards { max-width: 720px; margin: 0 auto; padding: 0 20px 64px; }
.card { display: block; background: #fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 16px; text-decoration: none; color: #1a1a1a; border: 1px solid transparent; transition: all .2s ease; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; opacity: 0; transition: opacity .2s; }
.card:nth-child(1)::before { background: linear-gradient(180deg, #ff6a5e, #e8346a); }
.card:nth-child(2)::before { background: linear-gradient(180deg, #667eea, #764ba2); }
.card:nth-child(3)::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
.card:hover { border-color: #eee; box-shadow: 0 8px 30px rgba(0,0,0,.06); transform: translateY(-2px); }
.card:hover::before { opacity: 1; }
.card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.card h3 { font-size: 18px; font-weight: 700; }
.badge { padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .3px; }
.badge-latest { background: linear-gradient(135deg, #ff6a5e, #e8346a); color: #fff; }
.badge-normal { background: #f5f5f5; color: #999; }
.card-desc { font-size: 13px; color: #999; display: flex; justify-content: space-between; align-items: center; }
.card-arrow { font-size: 20px; color: #ccc; transition: all .2s; }
.card:hover .card-arrow { color: #e8346a; transform: translateX(4px); }

/* ── footer ── */
.footer { text-align: center; padding: 0 20px 40px; font-size: 11px; color: #ccc; letter-spacing: .3px; }

@media (max-width: 480px) {
  .hero h1 { font-size: 24px; }
  .card { padding: 22px 20px; }
  .card h3 { font-size: 16px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><polygon points="8,5 20,12 8,19"/></svg>
      </div>
      <span class="logo-text">DramaBox</span>
    </a>
  </div>
</nav>

<div class="hero">
  <h1>用户反馈趋势分析</h1>
  <div class="subtitle">
    <span>产品差评分类</span>
    <span>用户投诉工单</span>
    <span>多语言剧集评分</span>
  </div>
  <div class="divider"></div>
</div>

<div class="cards">

  <a class="card" href="用户反馈趋势分析报告4-5月.html">
    <div class="card-top">
      <h3>4 - 5 月趋势报告</h3>
      <span class="badge badge-latest">最新</span>
    </div>
    <div class="card-desc">
      2026年4月 ~ 5月用户反馈数据对比与趋势洞察
      <span class="card-arrow">→</span>
    </div>
  </a>

  <a class="card" href="用户反馈趋势分析报告3-4月.html">
    <div class="card-top">
      <h3>3 - 4 月趋势报告</h3>
      <span class="badge badge-normal">2026/04</span>
    </div>
    <div class="card-desc">
      2026年3月 ~ 4月用户反馈数据对比与趋势洞察
      <span class="card-arrow">→</span>
    </div>
  </a>

  <a class="card" href="用户反馈趋势分析报告2-3月.html">
    <div class="card-top">
      <h3>2 - 3 月趋势报告</h3>
      <span class="badge badge-normal">2026/03</span>
    </div>
    <div class="card-desc">
      2026年2月 ~ 3月用户反馈数据对比与趋势洞察
      <span class="card-arrow">→</span>
    </div>
  </a>

</div>

<div class="footer">Produced by Zephyr 韩泽 · DramaBox 用户洞察</div>

</body>
</html>
